name: Feature request
description: Something Doorman should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do as a maintainer, and where Doorman gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
